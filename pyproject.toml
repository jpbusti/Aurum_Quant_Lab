[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurum-quant-lab"
version = "0.1.0"
description = "Laboratorio de investigación, backtesting y validación de estrategias XAU/USD sobre MetaTrader 5"
requires-python = ">=3.12,<3.13"
# numpy y PyYAML desde la fase A; pandas y pyarrow desde la fase B (Parquet).
dependencies = [
    "MetaTrader5>=5.0.5000; sys_platform == 'win32'",
    "numpy>=2.0",
    "PyYAML>=6.0",
    "pandas>=2.2,<3",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aurum = "aurum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mt5: necesita el terminal MetaTrader 5 abierto y conectado (cuenta demo)",
    "data: necesita los datos descargados en data/raw y data/processed",
]
# Las pruebas con el terminal o con los datos reales se ejecutan aparte: pytest -m "mt5 or data"
addopts = "-m 'not mt5 and not data'"
