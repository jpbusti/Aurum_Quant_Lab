# Hipótesis consideradas y no implementadas (se registran para no ocultarlas):
not_implemented:
  - id: CAND-SESSION-LONDON
    reason: >-
      La apertura de Londres en hora de Nueva York cambia con el desfase entre los horarios de
      verano de Reino Unido y EE. UU.; requiere la conversión a UTC, pendiente de confirmar en vivo.
      Las fuentes encontradas son material divulgativo, sin metodología reproducible.
  - id: CAND-VWAP-MR
    reason: >-
      El CFD no tiene volumen real fiable (real_volume sin verificar, fase B); un VWAP con
      tick_volume sería otra hipótesis distinta. Se deja para más adelante.
